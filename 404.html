<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 - Page Not Found</title>

<style>

/* RESET */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, Helvetica, sans-serif;
}

/* PAGE LAYOUT */
body{
    min-height:80vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f4f6f5;
    text-align:center;
}

/* MAIN CONTAINER */
.container{
    max-width:600px;
    width:90%;
    padding:60px;
}

/* TEXT BLOCK */
.text-block h1{
    font-size:40px;
    color:#222;
}

.text-block h2{
    font-size:34px;
    margin-top:10px;
    color:#444;
}

.text-block p{
    margin-top:15px;
    font-size:18px;
    color:#666;
}

/* IMAGE BLOCK */
.image-block{
    width:100%;
    height:320px;              
    margin-top:35px;
    border-radius:18px;
    overflow:hidden;
    background:#eaeaea;
    display:flex;
    justify-content:center;
    align-items:center;
    color:#999;
    font-size:18px;
}

/* IMAGE STYLE */
.image-block img{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* BUTTON BLOCK */
.button-block{
    margin-top:35px;
}

/* HOME BUTTON */
.home-btn{
    display:inline-block;
    padding:16px 45px;
    background:#4CAF50;
    color:white;
    text-decoration:none;
    font-size:18px;
    font-weight:bold;
    border-radius:40px;
    transition:0.3s;
}

.home-btn:hover{
    background:#3e9443;
}

</style>
</head>

<body>

<div class="container">

    <!-- ===== TEXT BLOCK ===== -->
    <div class="text-block">
        <h1>404</h1>
        <h2>Page Not Found</h2>
        <p>The page you are looking for does not exist or was moved.</p>
    </div>


    <!-- ===== IMAGE BLOCK ===== -->
    <div class="image-block">
        <img src="404-dog.png" alt="404 Image">
    </div>


    <!-- ===== BUTTON BLOCK ===== -->
    <div class="button-block">
        <a href="index.html" class="home-btn">Fetch Home</a>
    </div>

</div>

</body>
</html>
